# ─────────────────────────────────────────────────────────────────────────────
# 显示与排版设置
# 改这个文件就能调整邮件观感，不用碰代码。
# ─────────────────────────────────────────────────────────────────────────────

brand:
  title: "纳斯达克100 每日简报"
  subtitle: "NASDAQ-100 DAILY BRIEF"
  # 头部副标题里显示的数据口径说明
  tagline: "纳指回撤 · ETF溢价 · 全球对比 · 宏观技术面 · AI 解读"

# ── 涨跌颜色约定 ──────────────────────────────────────────────────────────────
# cn   = 涨红跌绿（中国大陆市场习惯，默认）
# intl = 涨绿跌红（欧美市场习惯）
#
# 注意：被合并进来的三个旧项目原来全部用的是 intl（涨绿跌红）。
# 改成 cn 后观感会和以前不同，改回 intl 只改这一行即可。
color_convention: cn

# ── 邮件正文配色（浅色主题）─────────────────────────────────────────────────
theme:
  page_bg: "#eef1f6"          # 邮件外底色
  card_bg: "#ffffff"          # 卡片底色
  ink: "#0f172a"              # 主文字
  ink_soft: "#475569"         # 次级文字
  ink_mute: "#94a3b8"         # 弱化文字
  line: "#e2e8f0"             # 分隔线
  panel: "#f8fafc"            # 内嵌面板底色
  header_from: "#0b1220"      # 头部渐变起点
  header_to: "#1e3a5f"        # 头部渐变终点
  accent: "#1d4ed8"           # 强调色

# ── 分档配色 ─────────────────────────────────────────────────────────────────
severity:
  normal:  "#16a34a"
  watch:   "#f59e0b"
  deep:    "#ea580c"
  extreme: "#dc2626"

# ── 区块开关 ─────────────────────────────────────────────────────────────────
# 不想要哪个区块就设成 false（内容不会丢，只是不渲染）
sections:
  toc: true                  # 顶部目录
  action: true               # 01 加仓决策
  drawdown_stats: true       # 02 纳指历史回撤统计
  etf_ranking: true          # 03 国内纳指ETF溢价排名
  index_overview: true       # 04 纳指市场概况
  macro: true                # 05 宏观指标仪表盘
  technical: true            # 06 技术指标
  verdict: true              # 07 综合研判
  movers: true               # 08 涨跌榜
  global_table: true         # 09 全球市场横向对比
  global_watch: true         # 10 全球重点观察
  global_alerts: true        # 11 全球回撤新信号
  ai: true                   # 12 AI 深度分析
  gold_etf: true             # 13 黄金 / 上海金 ETF 选择（费率 × 跟踪误差）

# ── 阈值与文案 ───────────────────────────────────────────────────────────────
thresholds:
  # QQQ 回撤加仓档位（%），与旧项目 nasdaq100-daily-report 保持一致
  qqq_add_2x: 10
  qqq_add_5x: 20
  # ETF 溢价可接受上限（%），与 config/strategy.yaml 的 premium_accept_max 保持一致
  etf_premium_ok: 2.0
