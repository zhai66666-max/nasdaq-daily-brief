name: 每日简报

# ═════════════════════════════════════════════════════════════════════════════
# 定时说明（重要）
#
# GitHub Actions 的 schedule 用的是 UTC，而且**不是准点触发**：
# 排队延迟普遍在 1.5～2.5 小时，高峰期更长（原 nasdaq-etf-monitor 声明 23:21 UTC
# 即北京 07:21，实测连续 12 天都落在北京 09:32 左右，晚了约 2 小时）。
#
# 因此这里把 cron 往前挪，用「名义时间 + 实测漂移」来逼近想要的实际送达时间：
#
#   cron 45 22 * * 1-5   UTC 周一~周五 22:45
#     = 北京时间 周二~周六 06:45（美股收盘后，数据已结算）
#     + 实测约 2 小时排队漂移
#     ≈ 北京时间 08:45 左右送达
#
# 为什么是周二~周六：美股在北京时间凌晨收盘，所以周一、周日的早上没有新数据，
# 加了只会每天多两封重复邮件。宁可少发，也不要凑数。
#
# 为什么 22:45 而不是更早：美股 16:00 ET 收盘 = UTC 20:00（夏令时）/ 21:00（冬令时）。
# 22:45 UTC 在两种时制下都留足了收盘到取数的间隔。
#
# 想改时间：只改下面那行 cron，然后把这行的注释一起更新，别让注释和时间对不上。
# ═════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "45 22 * * 1-5"
  workflow_dispatch:
    inputs:
      no_email:
        description: "只跑不发送（调试用）"
        type: boolean
        default: false

# 同一时间只允许一个实例；新任务不取消正在跑的，避免半途丢状态
concurrency:
  group: daily-brief
  cancel-in-progress: false

permissions:
  contents: write          # 需要把 DuckDB / 雷达状态回写仓库

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # ── 环境变量放在 job 级，所有步骤共享 ─────────────────────────────────────
    #
    # 为什么不是只给「生成并发送简报」那一步加 env：
    # 曾经就是那么写的，结果「导入自检」步骤跑在一个**没有这些变量**的环境里，
    # 而真实运行有（值为空字符串）。两者环境不一致，自检于是给出了假绿灯——
    # 模块级 `int(os.environ.get("SMTP_PORT", "587"))` 在自检里读到默认值 587 通过，
    # 在真实运行里读到 "" 直接抛 ValueError，整个「全球回撤雷达」数据源被静默吞掉。
    #
    # 放到 job 级之后，自检步骤自动获得了回归防护能力：
    # 未配置 secret 时变量为空字符串，任何「空值导致崩溃」的问题都会在自检就暴露，
    # 而不是等到补数据的时候才发现。
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      # ── 邮件：两套旧命名任选一套，配哪套用哪套 ──────────────────────────
      # 方案 A（原 nasdaq-etf-monitor）
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      # 方案 B（原 global-drawdown-radar / nasdaq100-daily-report）
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
      TEST_RECIPIENT: ${{ secrets.TEST_RECIPIENT }}
      EMAIL_BLOCKLIST: ${{ secrets.EMAIL_BLOCKLIST }}
      # ── AI 解读（不配也能跑，只是没有第 12 节）──────────────────────────
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 冒烟测试：确认所有模块可导入，并覆盖「空值环境变量」这一失效类别 ─────
      #
      # 这里跑两遍，第二遍在全新解释器里把所有凭据环境变量显式置为空字符串，
      # 复现 GitHub 未配置 secret 时的注入方式（key 存在、值为空）。
      #
      # 为什么必须显式置空：job 级 env 已经让常规那遍共享了真实运行的环境，
      # 但一旦用户把 secret 配齐，常规那遍就再也测不到空值了——而空值恰恰是
      # 最容易炸的一类（`os.environ.get(K, default)` 的 default 只在 key
      # **不存在** 时生效，secret 未配置时 key 存在但值为空字符串）。
      # 曾经就是这一类问题让「全球回撤雷达」整个数据源在云端静默消失。
      - name: 导入自检
        run: |
          cat > /tmp/check_imports.py <<'PY'
          import importlib, os, sys

          KEYS = ("EMAIL_HOST", "EMAIL_PORT", "EMAIL_USERNAME", "EMAIL_PASSWORD",
                  "EMAIL_TO", "SMTP_SERVER", "SMTP_PORT", "SENDER_EMAIL",
                  "SENDER_PASSWORD", "RECIPIENT_EMAIL", "TEST_RECIPIENT",
                  "EMAIL_BLOCKLIST", "DEEPSEEK_API_KEY")

          MODS = ["src.paths", "src.settings", "src.pipeline", "src.derive", "src.ai",
                  "src.render", "src.email_sender", "src.main",
                  "src.providers.common.bar_basis", "src.providers.common.us_history",
                  "src.providers.common.macro_fallback",
                  "src.providers.common.yf_breaker",
                  "src.providers.etf_monitor.config_loader",
                  "src.providers.etf_monitor.data_fetcher", "src.providers.etf_monitor.drawdown",
                  "src.providers.etf_monitor.etf", "src.providers.etf_monitor.ranking",
                  "src.providers.etf_monitor.database",
                  "src.providers.gold_etf",
                  "src.providers.drawdown_radar.config", "src.providers.drawdown_radar.data_fetcher",
                  "src.providers.drawdown_radar.drawdown", "src.providers.drawdown_radar.signal",
                  "src.providers.drawdown_radar.state", "src.providers.nasdaq100.core"]

          mode = sys.argv[1]
          if mode == "empty":
              for k in KEYS:
                  os.environ[k] = ""

          bad = []
          for m in MODS:
              try:
                  importlib.import_module(m)
              except Exception as e:
                  bad.append(f"{m}: {type(e).__name__}: {e}")

          label = "空值环境" if mode == "empty" else "常规环境"
          print(f"{label}导入自检：{len(MODS) - len(bad)}/{len(MODS)} 通过")
          if bad:
              print("失败模块：")
              for b in bad:
                  print("  -", b)
              raise SystemExit(f"{label}下有模块导入失败")
          PY
          # PYTHONPATH 必须显式指向仓库根：脚本放在 /tmp 时，Python 会把
          # **脚本所在目录**（/tmp）而不是当前目录放进 sys.path[0]，`import src` 会失败。
          PYTHONPATH="$PWD" python /tmp/check_imports.py normal
          PYTHONPATH="$PWD" python /tmp/check_imports.py empty

      # 口径自检：把「盘中未收盘 bar」这个场景**造出来**，验证派生指标只用收盘口径。
      # 本机永远测不出这条规则被违反（yfinance 限流 → 走官方兜底 → 兜底源要收盘后才收录当天），
      # 只有 Actions 在美股盘中跑才会命中；所以这里靠打桩把分支钉住。
      # 2026-09-25 就是靠它发现「52 周分位用实时价、回撤用收盘价」与「10 区块回撤随盘中跳动」。
      - name: 口径自检（盘中分支打桩）
        run: PYTHONPATH="$PWD" python scripts/check_bar_basis.py

      - name: 生成并发送简报
        run: |
          if [ "${{ inputs.no_email }}" = "true" ]; then
            python -m src.main --preview
          else
            python -m src.main
          fi

      # 不管成功失败都把成品留档，方便回看当期到底长什么样
      - name: 上传当日 HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_id }}
          path: |
            data/archive/*.html
            preview.html
          retention-days: 30
          if-no-files-found: ignore

      # DuckDB 行情库与雷达告警状态需要跨天累积，否则「新信号」每天都会重复报警
      - name: 回写状态与行情库
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/market.duckdb data/radar_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无状态变更，跳过提交"
          else
            git commit -m "chore(data): 更新行情库与雷达状态 [skip ci]"
            git push
          fi
